<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Agent factory. Before: One developer, several Claude Code sessions, and every change waiting for my review. After: 57 PRs merged in a single day. Release is still one human click.">
<defs><clipPath id="r"><rect width="880" height="250" rx="12"/></clipPath></defs>
<g clip-path="url(#r)">
  <rect width="880" height="250" fill="#f6f4f0"/>
  <rect x="480" y="0" width="400" height="250" fill="#ece8e1"/>
  <g><rect x="796" y="24" width="50" height="50" rx="11.4" fill="#b9770e"/><path class="cut" d="M806 64V44l8-6v6l8-6v6l8-6V30h6v34z" fill="#ece8e1"/></g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="40" y="54" fill="#1f1b18" font-size="24" font-weight="700">Agent factory</text>
    <text x="40" y="96" fill="#7d746b" font-size="12" font-weight="600" letter-spacing="2">BEFORE</text>
    <g fill="#4b443e" font-size="17"><text x="40" y="124">One developer, several Claude Code</text><text x="40" y="148">sessions, and every change</text><text x="40" y="172">waiting for my review.</text></g>
    <circle cx="480" cy="150" r="20" fill="#f6f4f0" stroke="#b9770e" stroke-width="2"/>
    <path d="M471 150h16m-6-6 6 6-6 6" stroke="#b9770e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="96" fill="#b9770e" font-size="12" font-weight="600" letter-spacing="2">AFTER</text>
    <text x="520" y="160" fill="#1f1b18" font-size="56" font-weight="700">57</text>
    <g fill="#4b443e" font-size="15"><text x="520" y="190">PRs merged in a single day.</text><text x="520" y="212">Release is still one human click.</text></g>
  </g>
</g>
<rect x=".5" y=".5" width="879" height="249" rx="11.5" fill="none" stroke="#ddd6cc"/>
</svg>
